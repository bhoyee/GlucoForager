name: EAS Update (OTA)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS Update branch (matches the channel embedded in the installed build, e.g. "production")'
        required: true
        default: 'production'
      message:
        description: 'Update message (shown in the EAS dashboard / rollback history)'
        required: true
      app_version:
        description: >-
          Which installed app version gets this update. "current" = the version in app.json (normal).
          "1.0.10" = users still on the previous store version, during the 1.0.11 rollout. Only send
          an update to an older version if it needs no new native modules (1.0.11 added none).
        required: true
        default: 'current'
        type: choice
        options:
          - current
          - '1.0.10'

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile-GApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # eas-cli@latest now requires Node >=22 (yarn add fails installing it under
          # Node 20 - "@oclif/plugin-autocomplete" et al. declare engines.node >=22).
          node-version: 22
          cache: npm
          cache-dependency-path: Mobile-GApp/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Target an older app version
        if: ${{ github.event.inputs.app_version != 'current' }}
        # runtimeVersion uses the "appVersion" policy, so the version decides which installs get it.
        # Only changed inside this run; the repo keeps the current version.
        run: |
          node -e "const f='app.json';const j=require('./'+f);j.expo.version='${{ github.event.inputs.app_version }}';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          node -e "console.log('Publishing for app version', require('./app.json').expo.version)"

      - name: EAS Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update --branch "${{ github.event.inputs.branch }}" --message "${{ github.event.inputs.message }}" --non-interactive
