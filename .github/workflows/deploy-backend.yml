name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile check
        run: |
          python -m compileall backend/app

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd /home/ubuntu/glucoforager
            # Deploy servers should not do interactive merges/rebases.
            # If the local branch diverged, force it to match GitHub `origin/main`.
            git fetch --prune origin
            git checkout main
            git reset --hard origin/main
            docker compose up -d --build
            docker compose run --rm api alembic upgrade head
            # Rebuilding glucoforager-api gives it a new container IP. The
            # shared nginx (pingloyal-nginx-1) caches that IP at its own
            # startup and won't notice, so reload it to avoid stale 502s.
            docker exec pingloyal-nginx-1 nginx -s reload || echo "warning: nginx reload failed or container not found"
