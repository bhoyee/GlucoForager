services:
  db:
    image: postgres:15-alpine
    container_name: glucoforager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: glucoforager
      POSTGRES_PASSWORD: glucoforager
      POSTGRES_DB: glucoforager
    ports:
      - "127.0.0.1:${HOST_DB_PORT:-15432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glucoforager"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./backend
    container_name: glucoforager-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # When running inside Docker, use service DNS names (not localhost) for DB/Redis.
    environment:
      DATABASE_URL: postgresql://glucoforager:glucoforager@db:5432/glucoforager
      REDIS_URL: redis://redis:6379/0
    ports:
      - "0.0.0.0:${HOST_API_PORT:-8011}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      - ./backend/backups:/app/backups
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: ./backend
    container_name: glucoforager-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # When running inside Docker, use service DNS names (not localhost) for DB/Redis.
    environment:
      DATABASE_URL: postgresql://glucoforager:glucoforager@db:5432/glucoforager
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.workers.ai_jobs"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      - ./backend/backups:/app/backups
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: glucoforager-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data:
